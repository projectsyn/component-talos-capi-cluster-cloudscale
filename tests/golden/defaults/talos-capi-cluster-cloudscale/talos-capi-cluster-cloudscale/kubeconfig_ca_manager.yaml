apiVersion: espejote.io/v1alpha1
kind: ManagedResource
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/name: capi-kubeconfig-ca-manager
  name: capi-kubeconfig-ca-manager
  namespace: syn-cluster-api
spec:
  context:
    - name: kubeconfig
      resource:
        apiVersion: v1
        kind: Secret
        name: c-green-test-1234-kubeconfig
  serviceAccountRef:
    name: capi-kubeconfig-ca-manager
  template: |
    local esp = import 'espejote.libsonnet';

    local config = import 'capi-kubeconfig-ca-manager/config.json';

    local kubeconfig =
      local kcs = esp.context().kubeconfig;
      assert std.length(kcs) == 1 : 'Expected kubeconfig context to have length 1';
      assert std.objectHas(kcs[0].data, 'value') : 'Expected kubeconfig secret to have field `value`';
      std.parseYaml(std.base64Decode(kcs[0].data.value));

    local user_kubeconfig =
      local contextName = 'oidc@%s' % kubeconfig.clusters[0].name;
      {
        apiVersion: 'v1',
        kind: 'Config',
        clusters: [
          kubeconfig.clusters[0] {
            cluster+: {
              [if config.apiURL != '' then 'server']:
                'https://%s:6443' % config.apiURL,
            },
          },
        ],
        contexts: [
          {
            context: {
              cluster: kubeconfig.clusters[0].name,
              user: 'oidc',
            },
            name: contextName,
          },
        ],
        'current-context': contextName,
        users: [
          {
            name: 'oidc',
            user: {
              exec: {
                apiVersion: 'client.authentication.k8s.io/v1beta1',
                args: [
                  'oidc-login',
                  'get-token',
                  '--oidc-issuer-url=%s' % config.oidcIssuerURL,
                  '--oidc-client-id=%s' % config.oidcClientId,
                  '--oidc-extra-scope=email offline_access profile openid',
                ],
                command: 'kubectl',
                interactiveMode: 'IfAvailable',
                provideClusterInfo: false,
              },
            },
          },
        ],
      };
    local index_html = importstr 'capi-kubeconfig-ca-manager/index.html';
    local caddy_json = importstr 'capi-kubeconfig-ca-manager/caddy.json';
    local confighash = std.sha256(
      std.manifestJsonMinified(user_kubeconfig) + index_html + caddy_json
    );

    [
      {
        apiVersion: 'v1',
        kind: 'ConfigMap',
        metadata: {
          name: config.dynfactConfigMapName,
          namespace: 'syn',
          labels: {
            'app.kubernetes.io/managed-by': 'espejote',
            'steward.syn.tools/include-facts': '',
          },
        },
        data: {
          facts: std.manifestJsonMinified({
            talosAPICertificateAuthorityData:
              kubeconfig.clusters[0].cluster['certificate-authority-data'],
          }),
        },
      },
      {
        apiVersion: 'v1',
        kind: 'ConfigMap',
        metadata: {
          name: config.caddyResourceName,
          namespace: config.namespace,
        },
        data: {
          // manifestYamlDoc doesn't add a trailing newline, so we do it
          // ourselves.
          kubeconfig: std.manifestYamlDoc(user_kubeconfig, quote_keys=false) + '\n',
          'index.html': index_html,
          'caddy.json': caddy_json,
        },
      },
      esp.applyOptions(
        {
          apiVersion: 'apps/v1',
          kind: 'Deployment',
          metadata: {
            name: config.caddyResourceName,
            namespace: config.namespace,
          },
          spec: {
            template: {
              metadata: {
                annotations: {
                  ['%s.syn.tools/config-hash' % config.caddyResourceName]: confighash,
                },
              },
            },
          },
        },
        fieldManagerSuffix=':reloader',
        force=true,
      ),
    ]
  triggers:
    - name: kubeconfig
      watchContextResource:
        name: kubeconfig
    - name: dynfact
      watchResource:
        apiVersion: v1
        kind: ConfigMap
        name: additional-fact-capi-ca
        namespace: syn
    - name: jsonnetlib
      watchResource:
        apiVersion: espejote.io/v1alpha1
        kind: JsonnetLibrary
        name: capi-kubeconfig-ca-manager
        namespace: syn-cluster-api
---
apiVersion: espejote.io/v1alpha1
kind: JsonnetLibrary
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/name: capi-kubeconfig-ca-manager
  name: capi-kubeconfig-ca-manager
  namespace: syn-cluster-api
spec:
  data:
    caddy.json: '{"admin":{"disabled":true},"apps":{"http":{"servers":{"srv0":{"listen":[":8000"],"routes":[{"handle":[{"body":"OK","handler":"static_response","status_code":200}],"match":[{"path":["/healthz"]}]},{"handle":[{"handler":"static_response","headers":{"Location":["/kubeconfig"]},"status_code":302}],"match":[{"header":{"Accept":["text/plain"]},"path":["/"]}]},{"handle":[{"handler":"encode"},{"file_root":"/data","handler":"templates"},{"handler":"file_server","hide":["caddy.json"],"root":"/data"}]}]}}}}}'
    config.json: |-
      {
          "apiURL": "",
          "caddyResourceName": "user-kubeconfig",
          "dynfactConfigMapName": "additional-fact-capi-ca",
          "namespace": "syn-cluster-api",
          "oidcClientId": "",
          "oidcIssuerURL": ""
      }
    index.html: |
      <!DOCTYPE html>
      <html>
        <head>
          <title>{{ env "CLUSTER_NAME" }} Kubeconfig</title>
          <style>
            body {
              font-family: 'sans-serif';
              width: 50%;
              margin: 0 auto;
            }

            pre {
              font-size: 120%;
              display: block;
              background: #ddd;
              border: 1px solid #333;
              white-space: pre-wrap;
              word-wrap: break-word;
              padding: 1ex;
            }
            code {
              user-select: all;
            }
            li > code {
              font-size: 120%;
            }

            * :has(> [class="copy"]) {
              position: relative;
            }

            [class="copy"]::after {
              content: "[copy]";
              position: absolute;
              right: 6.5em;
              top: 0;
              margin: 0.5em;
            }
            li [class="copy"]::after {
              right: 0;
            }
            li {
              margin: 0.7ex 0;
            }
            li > pre {
              margin-top: 0.5ex;
              margin-bottom: 0.5ex;
            }

            a.download {
              position: absolute;
              right: 0;
              top: 0;
              margin: 0.5em;
              color: black;
              text-decoration: none;
            }

            a.download:hover {
              font-weight: bold;
            }

            [class="copy"]:hover::after {
              font-weight: bold;
              cursor: pointer;
            }

            .copied > [class="copy"]::after {
              content: "[copied]";
            }
          </style>
          <script>
            window.onload = () => {
              document.querySelectorAll('[class="copy"]').forEach($el =>
                $el.addEventListener('click', async ($el) => {
                  const $node = $el.target;
                  const content = $node.textContent;
                  try {
                    await navigator.clipboard.writeText(content);
                  } catch (error) {
                    console.error(error.message);
                  }
                  $node.parentNode.classList.add('copied');
                  setTimeout(($n => () => $n.classList.remove('copied'))($node.parentNode), 1000);
                })
              );
            }
          </script>
        </head>
        <body>
          <h1>{{ env "CLUSTER_NAME" }} Kubeconfig</h1>
          <p>
            <!-- NOTE(sg): the whole <pre> contents must be in a single line to not mess up the formatting! -->
            <pre><a class="download" href="./kubeconfig" download="{{ env "CLUSTER_NAME" }}.kubeconfig">[download]</a><code class="copy">{{- readFile "kubeconfig" -}}</code></pre>
          </p>
          <h1>First time setup</h1>
          <ol>
            <li>Make sure you have a recent <code>kubectl</code> installed. See the <a href="https://kubernetes.io/docs/tasks/tools/#kubectl">upstream docs</a> for install instructions.</li>
            <li>Download the <code>kubectl</code> <a href="https://github.com/int128/kubelogin#setup" target="_blank">kubelogin</a> plugin and ensure it&rsquo;s available in your <code>$PATH</code> as <code>kubectl-oidc_login</code></li>
            <li>Verify that the plugin is available.<br/>
              <pre class="li"><code class="copy">kubectl oidc-login --version</code></pre>
            </li>
            <li>Download this cluster&rsquo;s <a href="./kubeconfig" download="{{ env "CLUSTER_NAME" }}.kubeconfig">kubeconfig</a></li>
            <li>Set the <code>$KUBECONFIG</code> environment variable<br/>
              <pre class="li"><code class="copy">export KUBECONFIG=~/Downloads/{{ env "CLUSTER_NAME" }}.kubeconfig</code></pre>
            </li>
            <li>Test access<br/>
              <pre class="li"><code class="copy">kubectl auth whoami</code></pre>
              If everything is setup correctly, this should authenticate you with your VSHN account in your browser and then show some details about your user.
            </li>
          </ol>
        </body>
      </html>
---
