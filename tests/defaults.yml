applications:
  - cilium

parameters:
  kapitan:
    dependencies:
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-capi-core/master/lib/capi-core.libsonnet
        output_path: vendor/lib/capi-core.libsonnet
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-capi-provider-cloudscale/master/lib/capi-provider-cloudscale.libsonnet
        output_path: vendor/lib/capi-provider-cloudscale.libsonnet
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-capi-provider-talos/master/lib/capi-provider-talos.libsonnet
        output_path: vendor/lib/capi-provider-talos.libsonnet
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-tuppr/master/lib/tuppr.libsonnet
        output_path: vendor/lib/tuppr.libsonnet

  cilium:
    cilium_helm_values:
      kubeProxyReplacement: "true"

  capi_provider_talos:
    images:
      capi-controlplane-provider-talos:
        tag: v0.6.0-alpha.2
